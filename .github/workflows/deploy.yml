name: Deploy site to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build release notes
        run: python scripts/build_releases.py

      - name: Minify production assets
        run: python scripts/minify.py

      # Only the site itself is published, not the build scripts, README or workflows.
      - name: Collect the site
        run: |
          mkdir _site
          cp -r *.html *.txt *.xml *.json favicon.ico assets _site/

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=cassettecat --branch=main
